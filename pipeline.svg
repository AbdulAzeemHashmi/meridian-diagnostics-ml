<svg xmlns="http://www.w3.org/2000/svg" width="900" height="160" viewBox="0 0 900 160" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="900" height="160" rx="14" fill="#14232c"/>
<text x="450" y="30" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9fb8c8">Project pipeline</text>
<rect x="20" y="52" width="125" height="56" rx="10" fill="#4da3ff" fill-opacity="0.18" stroke="#4da3ff" stroke-width="2"><animate attributeName="stroke-opacity" values="1;0.4;1" dur="3s" begin="0.0s" repeatCount="indefinite"/></rect>
<text x="82.5" y="85.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e8f1f8">Load data</text>
<rect x="165" y="52" width="125" height="56" rx="10" fill="#5ad1a5" fill-opacity="0.18" stroke="#5ad1a5" stroke-width="2"><animate attributeName="stroke-opacity" values="1;0.4;1" dur="3s" begin="0.4s" repeatCount="indefinite"/></rect>
<text x="227.5" y="85.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e8f1f8">Stratified split</text>
<rect x="310" y="52" width="125" height="56" rx="10" fill="#ffd166" fill-opacity="0.18" stroke="#ffd166" stroke-width="2"><animate attributeName="stroke-opacity" values="1;0.4;1" dur="3s" begin="0.8s" repeatCount="indefinite"/></rect>
<text x="372.5" y="85.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e8f1f8">Standardise</text>
<rect x="455" y="52" width="125" height="56" rx="10" fill="#ff9f5a" fill-opacity="0.18" stroke="#ff9f5a" stroke-width="2"><animate attributeName="stroke-opacity" values="1;0.4;1" dur="3s" begin="1.2s" repeatCount="indefinite"/></rect>
<text x="517.5" y="85.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e8f1f8">Train models</text>
<rect x="600" y="52" width="125" height="56" rx="10" fill="#c792ea" fill-opacity="0.18" stroke="#c792ea" stroke-width="2"><animate attributeName="stroke-opacity" values="1;0.4;1" dur="3s" begin="1.6s" repeatCount="indefinite"/></rect>
<text x="662.5" y="85.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e8f1f8">Compare</text>
<rect x="745" y="52" width="125" height="56" rx="10" fill="#ff5c7a" fill-opacity="0.18" stroke="#ff5c7a" stroke-width="2"><animate attributeName="stroke-opacity" values="1;0.4;1" dur="3s" begin="2.0s" repeatCount="indefinite"/></rect>
<text x="807.5" y="85.0" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e8f1f8">Recommend</text>
<line x1="147" y1="80.0" x2="163" y2="80.0" stroke="#9fb8c8" stroke-width="2.5" stroke-dasharray="5 4"><animate attributeName="stroke-dashoffset" values="18;0" dur="1s" repeatCount="indefinite"/></line>
<line x1="292" y1="80.0" x2="308" y2="80.0" stroke="#9fb8c8" stroke-width="2.5" stroke-dasharray="5 4"><animate attributeName="stroke-dashoffset" values="18;0" dur="1s" repeatCount="indefinite"/></line>
<line x1="437" y1="80.0" x2="453" y2="80.0" stroke="#9fb8c8" stroke-width="2.5" stroke-dasharray="5 4"><animate attributeName="stroke-dashoffset" values="18;0" dur="1s" repeatCount="indefinite"/></line>
<line x1="582" y1="80.0" x2="598" y2="80.0" stroke="#9fb8c8" stroke-width="2.5" stroke-dasharray="5 4"><animate attributeName="stroke-dashoffset" values="18;0" dur="1s" repeatCount="indefinite"/></line>
<line x1="727" y1="80.0" x2="743" y2="80.0" stroke="#9fb8c8" stroke-width="2.5" stroke-dasharray="5 4"><animate attributeName="stroke-dashoffset" values="18;0" dur="1s" repeatCount="indefinite"/></line>

<text x="450" y="140" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9fb8c8">Every step is written with NumPy, then checked with asserts</text>
</svg>
